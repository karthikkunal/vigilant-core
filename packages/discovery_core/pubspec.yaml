name: discovery_core
description: >-
  Pure-Dart domain discovery engine. Queries RDAP, DNS and Certificate
  Transparency, and models the results. Resolver is pluggable. No Flutter dependency.
version: 0.1.0
license: GPL-3.0-or-later
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  http: ^1.2.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
